server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    root __APP_DIST__;
    index index.html;

    client_max_body_size 70m;

    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        alias __UPLOADS_DIR__/;
        autoindex off;
        expires 7d;
        add_header Cache-Control "public";
    }

    # The manifest is rewritten by category moves and is never in the bucket,
    # so it is always served from disk -- and must be matched before the
    # gallery rule below.
    location = /assets/gallery/gallery-manifest.json {
        alias __GALLERY_DIR__/gallery-manifest.json;
        add_header Cache-Control "no-cache";
    }

    # Gallery media. bootstrap-vps.sh replaces this block with a redirect to the
    # R2 bucket when MEDIA_CDN_URL is configured, so media bytes never leave the
    # VPS; templates hard-code a few gallery paths that bypass the manifest.
    location /assets/gallery/ {
        __GALLERY_LOCATION_BODY__
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
